<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Email Classifier</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Auth Screen -->
        <div id="auth-screen" class="screen active">
            <div class="auth-container">
                <h1>Email AI</h1>
                <p>Intelligent Student Email System</p>
                <div class="tabs">
                    <button id="tab-login" class="active" onclick="showAuth('login')">Login</button>
                    <button id="tab-register" onclick="showAuth('register')">Register</button>
                </div>
                
                <form id="login-form">
                    <input type="email" id="login-email" placeholder="Email" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit">Log In</button>
                </form>

                <form id="register-form" style="display: none;">
                    <input type="email" id="reg-email" placeholder="Email" required>
                    <input type="password" id="reg-password" placeholder="Create Password" required>
                    <button type="submit">Sign Up</button>
                </form>
            </div>
        </div>

        <!-- Dashboard Screen -->
        <div id="dashboard-screen" class="screen">
            <nav class="sidebar">
                <div class="brand">Email AI</div>
                <button class="compose-btn" onclick="openCompose()">+ Compose</button>
                <ul class="menu">
                    <li onclick="loadInbox('all')" class="active">All Mail</li>
                    <li onclick="loadInbox('Assignments')">Assignments</li>
                    <li onclick="loadInbox('Notices')">Notices</li>
                    <li onclick="loadInbox('Personal')">Personal</li>
                    <li onclick="loadInbox('Spam')">Spam</li>
                </ul>
                <div class="user-profile">
                    <span id="user-email-display">user@example.com</span>
                    <button onclick="logout()">Logout</button>
                </div>
            </nav>
            <main class="content">
                <header>
                    <h2 id="page-title">Inbox</h2>
                    <button onclick="loadInbox()" class="refresh-btn">Refresh</button>
                </header>
                <div id="email-list" class="email-list">
                    <!-- Emails will be populated here -->
                </div>
            </main>
        </div>

        <!-- Compose Modal -->
        <div id="compose-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>New Message</h3>
                    <button onclick="closeCompose()">×</button>
                </div>
                <form id="compose-form">
                    <input type="email" id="compose-to" placeholder="To" required>
                    <input type="text" id="compose-subject" placeholder="Subject" required>
                    <textarea id="compose-body" placeholder="Write your message..." rows="10" required></textarea>
                    <div class="modal-footer">
                        <button type="submit">Send Message</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="toast">Action Successful</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
