<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email AI — Intelligent Student Email System</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app">
        <!-- Auth Screen -->
        <div id="auth-screen" class="screen active">
            <div class="auth-bg-pattern"></div>
            <div class="auth-container">
                <div class="auth-logo">
                    <span class="auth-logo-icon" aria-hidden="true">✉</span>
                    <h1>Email AI</h1>
                    <p>Intelligent Student Email System</p>
                </div>
                <div class="tabs" role="tablist">
                    <button id="tab-login" class="tab active" role="tab" aria-selected="true" onclick="showAuth('login')">Sign in</button>
                    <button id="tab-register" class="tab" role="tab" aria-selected="false" onclick="showAuth('register')">Create account</button>
                </div>

                <form id="login-form" class="auth-form">
                    <label class="sr-only" for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="Email address" required autocomplete="email">
                    <label class="sr-only" for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
                    <button type="submit" class="btn-primary">Sign in</button>
                </form>

                <form id="register-form" class="auth-form" style="display: none;">
                    <label class="sr-only" for="reg-email">Email</label>
                    <input type="email" id="reg-email" placeholder="Email address" required autocomplete="email">
                    <label class="sr-only" for="reg-password">Password</label>
                    <input type="password" id="reg-password" placeholder="Create a password" required autocomplete="new-password">
                    <button type="submit" class="btn-primary">Create account</button>
                </form>
            </div>
        </div>

        <!-- Dashboard Screen -->
        <div id="dashboard-screen" class="screen">
            <nav class="sidebar" aria-label="Main navigation">
                <div class="sidebar-brand">
                    <span class="sidebar-logo" aria-hidden="true">✉</span>
                    <span>Email AI</span>
                </div>
                <button class="compose-btn" onclick="openCompose()">
                    <span class="compose-btn-icon">+</span>
                    Compose
                </button>
                <ul class="menu" role="navigation">
                    <li data-category="all" class="active" onclick="loadInbox('all')">
                        <span class="menu-icon" aria-hidden="true">📥</span>
                        All Mail
                    </li>
                    <li data-category="Assignments" onclick="loadInbox('Assignments')">
                        <span class="menu-icon" aria-hidden="true">📋</span>
                        Assignments
                    </li>
                    <li data-category="Notices" onclick="loadInbox('Notices')">
                        <span class="menu-icon" aria-hidden="true">📢</span>
                        Notices
                    </li>
                    <li data-category="Personal" onclick="loadInbox('Personal')">
                        <span class="menu-icon" aria-hidden="true">👤</span>
                        Personal
                    </li>
                    <li data-category="Spam" onclick="loadInbox('Spam')">
                        <span class="menu-icon" aria-hidden="true">🚫</span>
                        Spam
                    </li>
                </ul>
                <div class="user-profile">
                    <span id="user-email-display" class="user-email">user@example.com</span>
                    <button class="logout-btn" onclick="logout()">Sign out</button>
                </div>
            </nav>
            <main class="content">
                <header class="content-header">
                    <h1 id="page-title" class="page-title">Inbox</h1>
                    <div class="header-actions">
                        <div class="classification-toggle-wrap" role="switch" aria-checked="true" aria-label="AI email classification">
                            <span class="classification-toggle-label">AI classification</span>
                            <button type="button" id="classification-toggle" class="toggle-btn" onclick="toggleClassification()" title="Turn AI email classification on or off" aria-pressed="true">
                                <span class="toggle-track">
                                    <span class="toggle-thumb"></span>
                                </span>
                            </button>
                        </div>
                        <button type="button" class="refresh-btn" onclick="loadInbox(getCurrentCategory())" title="Refresh">
                            <span class="refresh-icon" aria-hidden="true">↻</span>
                            Refresh
                        </button>
                    </div>
                </header>
                <div id="email-list" class="email-list" role="list">
                    <!-- Emails populated by JS -->
                </div>
            </main>
        </div>

        <!-- Compose Modal -->
        <div id="compose-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="compose-title" aria-hidden="true">
            <div class="modal-backdrop" onclick="closeCompose()"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="compose-title" class="modal-title">New message</h2>
                    <button type="button" class="modal-close" onclick="closeCompose()" aria-label="Close">×</button>
                </div>
                <form id="compose-form">
                    <label class="sr-only" for="compose-to">To</label>
                    <input type="email" id="compose-to" placeholder="To" required>
                    <label class="sr-only" for="compose-subject">Subject</label>
                    <input type="text" id="compose-subject" placeholder="Subject" required>
                    <label class="sr-only" for="compose-body">Message</label>
                    <textarea id="compose-body" placeholder="Write your message…" rows="10" required></textarea>
                    <div class="modal-footer">
                        <button type="button" class="btn-secondary" onclick="closeCompose()">Cancel</button>
                        <button type="submit" class="btn-primary">Send</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Toast -->
        <div id="toast" class="toast" role="status" aria-live="polite">Action successful</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/static/app.js"></script>
</body>

</html>
